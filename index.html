<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUT Sports Team Attendance</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #111827;
            margin-bottom: 8px;
            font-size: 22px;
        }
        p.subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #25d366;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #25d366;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #1ebc57;
        }
        .status-message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            display: none;
            background-color: #def7ec;
            color: #03543f;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>OUT Sports Team Attendance</h2>
    <p class="subtitle">تسجيل الحضور اليومي</p>

    <div class="input-group">
        <label for="fullName">اكتب اسمك:</label>
        <input type="text" id="fullName" placeholder="الاسم ثلاثي" required autocomplete="off">
    </div>

    <button onclick="sendAttendance()">تسجيل الحضور</button>

    <div id="status" class="status-message">تم تسجيل الحضور بنجاح.</div>
</div>

<script>
    function sendAttendance() {
        const nameInput = document.getElementById("fullName");
        const name = nameInput.value.trim();

        if (!name) {
            alert("يرجى كتابة الاسم قبل التسجيل.");
            return;
        }

        const now = new Date();
        const dateOptions = { timeZone: "Africa/Cairo", year: "numeric", month: "2-digit", day: "2-digit" };
        const timeOptions = { timeZone: "Africa/Cairo", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true };

        const currentDate = now.toLocaleDateString("en-GB", dateOptions);
        const currentTime = now.toLocaleTimeString("en-US", timeOptions);

        const myPhoneNumber = "201222438900";
        const message = `OUT Sports Team Attendance\nالاسم: ${name}\nالتاريخ: ${currentDate}\nالوقت: ${currentTime}`;

        document.getElementById("status").style.display = "block";

        const whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
        
        setTimeout(() => {
            window.location.href = whatsappUrl;
        }, 600);
    }
</script>

</body>
</html>
